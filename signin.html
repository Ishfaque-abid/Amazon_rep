<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-in</title>
    <link rel="stylesheet" href="signin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
        integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header>
        <div class="nav-logo">
            <div class="top-logo">
                <div class="logo">
                </div>
            </div>
        </div>
    </header>

    <div class="s-i-box">
        <div class="s-i-contant">
            <div class="box-heading">
                <h1>Sign in or create account</h1>
                <b>
                    <p>Enter mobile number or email</p>
                </b>
                <input type="text">
                <br>
                <button class="s-i-button">
                    Continue
                </button>
                <br><br>
                <p>By continuing, you agree to Amazon's <a
                        href="https://www.amazon.com/gp/help/customer/display.html/ref=ap_signin_notification_condition_of_use?ie=UTF8&nodeId=508088">Conditions
                        of Use</a> and <a
                        href="https://www.amazon.com/gp/help/customer/display.html/ref=ap_signin_notification_privacy_notice?ie=UTF8&nodeId=468496">Privacy
                        Notice. </p></a>
                <br>
                <a href="https://www.amazon.com/gp/help/customer/account-issues/ref=unified_claim_collection?ie=UTF8">
                    Need help?</a>
                <div class="line">
                </div>
                <div class="work">
                    Buying for work?
                    <br>
                    <a href="https://www.amazon.com/business/register/org/landing?ref_=ab_reg_signin_unifiedauth">Create
                        a free business account</a>

                </div>
            </div>
        </div>
    </div>
</body>

</html>
